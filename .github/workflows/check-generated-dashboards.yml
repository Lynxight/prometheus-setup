name: check-generated-dashboards

# Fail when a committed dashboard JSON has drifted from its generator
# (hand-edited, or generator changed without re-running it). Runs on every PR
# — the check is stdlib-only and takes seconds, so there's no need to gate it
# behind a path filter (which would also deadlock it as a required check on
# PRs that don't touch those paths).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      # Generators are stdlib-only, so no dependency install step is needed.
      - name: Verify generated dashboards are in sync
        run: python3 helpers/check_generated_dashboards.py
